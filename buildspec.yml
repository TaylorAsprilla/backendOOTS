version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - node --max-old-space-size=1024 ./node_modules/@nestjs/cli/bin/nest.js build
      - echo "Verificando dist generado..."
      - ls -la dist/

artifacts:
  files:
    - '**/*'
  base-directory: '.'
