version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - node --max-old-space-size=1024 node_modules/@nestjs/cli/bin/nest.js build
  post_build:
    commands:
      - echo Build completado

artifacts:
  files:
    - 'dist/**/*'
    - 'node_modules/**/*'
    - 'package.json'
    - 'package-lock.json'
    - '.ebextensions/**/*'
